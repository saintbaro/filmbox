<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filmbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&display=swap">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d1d22;--mut:#8a8a93;--line:#e2ded3;--acc:#3b5bdb;--g:#2f9e44;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#25272e;--ink:#f1f1f4;--mut:#8d8f99;--line:#363840;--acc:#748ffc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15161a;--card:#25272e;--ink:#f1f1f4;--mut:#8d8f99;--line:#363840;--acc:#748ffc;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#lucky{display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:38px;padding:6px 11px}
#lucky .shuffle-icon{display:block;width:20px;height:20px;flex:none}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:12px 14px;gap:10px}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:19px;margin:0;flex:1}
h1.logo{font-family:"Limelight",Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;letter-spacing:4px}
.pill,.ib{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--ink);font-family:inherit}
.tag{color:var(--mut);font-size:14px;margin:0 0 4px}
.gal{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding:0 max(14px,calc((100vw - 452px)/2)) 12px;position:relative;left:50%;transform:translateX(-50%);width:100vw;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--mut) transparent}
.cc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px}
.cc .r{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px}
.cc .r span{font-size:14px;color:var(--mut)}
.pb{height:5px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--c)}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.row .th{width:58px;flex:none;aspect-ratio:2/3;border-radius:6px;background-size:cover;background-position:center;background-color:#222}
.row.l{opacity:.55}
.mos{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);padding:1px;filter:blur(1.6px) saturate(.8)}
.mos i{display:block;background-size:300% 400%;background-repeat:no-repeat}
.th.lk{display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--mut);font-weight:700;font-size:22px}
.row b{font-size:16px}.row small{display:block;color:var(--mut);margin-top:4px;font-size:13px}
.play{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:600;font-family:inherit}
.seg button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent)}
.info{text-align:center;color:var(--mut);font-size:14px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.poster{position:relative;aspect-ratio:2/3;width:min(100%,calc((100vh - 260px)*2/3));width:min(100%,calc((100dvh - 260px)*2/3))}
#board{display:grid;touch-action:manipulation}
.t{background-repeat:no-repeat;border-radius:5px!important;border:2px solid transparent;overflow:hidden;transform:none}
.t.sel{border-color:var(--acc);transform:none}
.t.ok{border-color:#218838;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 0 0 1px rgba(33,136,56,.45)}
:root[data-theme="light"] .t.ok{border-color:#16812f;box-shadow:inset 0 0 0 1px #fff,0 0 0 1px rgba(22,129,47,.55)}
#board.done .t{border:0;border-radius:0!important;box-shadow:none}
.flip{perspective:900px;cursor:pointer}
.fi{position:absolute;inset:0;transition:transform .8s;transform-style:preserve-3d}
.flip.f .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden}
.front{background-size:cover}
.back{transform:rotateY(180deg);background:var(--card);border:1px solid var(--line);padding:14px;overflow:auto;display:flex;flex-direction:column}
.back h2{margin:0 0 2px;font-size:20px}
.back h3{margin:10px 0 2px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc)}
.back p{margin:0;font-size:13px;line-height:1.45}
.back .m{color:var(--mut);font-size:12px;margin-top:8px}
.watched{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px;font-weight:650;cursor:pointer;text-align:center;flex-shrink:0}.watched input{width:18px;height:18px;accent-color:var(--acc)}
.ctl{display:flex;gap:8px}
.ctl.col{flex-direction:column}
.btn{flex:1;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:700;padding:12px;border-radius:14px;font-family:inherit}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov.on{display:flex}
.sbox{background:var(--card);border-radius:20px;padding:22px;max-width:340px;width:100%}
.sbox h2{margin:0 0 4px;font-size:22px}
.sbox h3{margin:16px 0 8px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc)}
.sbox small{display:block;color:var(--mut);margin-top:6px;font-size:12px}
input[type=range]{width:100%;margin-top:12px;accent-color:var(--acc)}
.rt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.rating-link{display:inline-flex;align-items:center;gap:3px;background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--ink);text-decoration:none}
.rating-link:hover,.rating-link:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rt b{color:var(--acc);margin-right:3px}
/* Mobile layout: let the puzzle and information card use the full screen width, and scroll vertically instead of squeezing the content. */
@media (max-width:600px){
  html,body{height:auto;min-height:100%;}
  body{min-height:100dvh;overflow-y:auto;}
  .app{height:auto;min-height:100dvh;padding:10px 12px;gap:10px;}
  .top{gap:7px;flex-shrink:0;}
  h1.logo{font-size:27px;letter-spacing:3px;}
  .gal{flex:1 0 auto;min-height:0;overflow:visible;padding:0 0 16px;left:auto;transform:none;width:100%;scrollbar-gutter:auto;}
  .play{flex:0 0 auto;min-height:0;gap:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));}
  .info{font-size:15px;min-height:20px;}
  .stage{flex:0 0 auto;min-height:0;width:100%;}
  .poster{width:100%;max-width:440px;flex:none;}
  .back{padding:clamp(16px,5vw,22px);}
  .back h2{font-size:clamp(22px,6vw,28px);line-height:1.18;margin-bottom:5px;}
  .back h3{font-size:12px;letter-spacing:1.2px;margin-top:14px;}
  .back p{font-size:clamp(15px,3.9vw,17px);line-height:1.5;}
  .back .m{font-size:14px;line-height:1.4;margin-top:7px;}
  .rt{gap:6px;margin-top:10px;}
  .rating-link{font-size:13px;padding:7px 9px;}
  .watched{font-size:14px;padding-top:14px;gap:10px;}
  .watched input{width:20px;height:20px;}
  .ctl{flex-shrink:0;}
  .btn{padding:14px 12px;font-size:16px;}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="ib" id="back" hidden onclick="goBack()">←</button><h1 id="ttl" class="logo">FILMBOX</h1><button class="ib" id="lucky" onclick="luckyGo()" aria-label="I’m Feeling Lucky" title="I’m Feeling Lucky"><svg class="shuffle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h2.5a5 5 0 0 0 4-2l6.9-8.1a5 5 0 0 1 4-2H22"/><path d="M2 6h2.5a5 5 0 0 1 4 2l6.9 8.1a5 5 0 0 0 4 2H22"/></svg></button><button class="ib" id="gear" onclick="openSet()" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><div class="pill" id="cnt">0/15</div></div>
  <div class="gal" id="gal"></div>
  <div class="play" id="play" hidden>
    
    <div class="info" id="info">&nbsp;</div>
    <div class="stage">
      <div class="poster" id="pz"><div id="board"></div></div>
      <div class="poster flip" id="flip" hidden onclick="this.classList.toggle('f')"><div class="fi"><div class="face front" id="fr"></div><div class="face back" id="bk"></div></div></div>
    </div>
    <div class="ctl">
      
      
      <button class="btn" id="bNext" onclick="next()" hidden>Next film →</button>
      <button class="btn" id="bLC" onclick="luckyCont()" hidden>Continue in this category</button>
      <button class="btn sec" id="bWatch" onclick="luckyWatch()" hidden>I’ll watch it and come back</button>
    </div>
  </div>
</div>

<div class="ov" id="wov" onclick="wclose()"><div class="sbox" style="text-align:center"><h2 id="wh" style="font-size:26px">Enjoy the movie!</h2><small id="wp">Come back when you’re done.</small></div></div>
<div class="ov" id="sov"><div class="sbox"><h2>Settings</h2><h3>Appearance</h3><div class="seg" id="tseg"><button id="themeLight" onclick="setTheme('light')">☀ Light</button><button id="themeDark" onclick="setTheme('dark')">☾ Dark</button></div><h3>Difficulty</h3><div class="seg" id="dseg"></div><small>Changing it restarts the current puzzle.</small><button class="btn sec" style="margin-top:16px;width:100%" onclick="closeSet()">Close</button></div></div>

];
const uri=F.map(f=>'url(data:image/svg+xml,'+encodeURIComponent(f.v).replace(/['()]/g,c=>'%'+c.charCodeAt(0).toString(16))+')');
const DIFF=[["Easy 3×4",3,4],["Medium 4×6",4,6],["Hard 6×9",6,9]];
let saved={},watched={},cur=-1,cat=-1,view='home',lv=0,cols=3,rows=4,order=[],sel=-1,moves=0,solved=false;
try{watched=JSON.parse(localStorage.getItem('fb_watched')||'{}')}catch(e){}
const saveWatched=()=>{try{localStorage.setItem('fb_watched',JSON.stringify(watched))}catch(e){}}
try{saved=JSON.parse(localStorage.getItem('fb1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('fb1',JSON.stringify(saved))}catch(e){}};
const inCat=k=>F.map((f,i)=>i).filter(i=>F[i].k===k);
const done=i=>saved[i]!==undefined;
const open_=i=>{const l=inCat(F[i].k),p=l.indexOf(i);return p===0||done(l[p-1])};
const mos=i=>{const r=R(i*7+3),a=[...Array(12).keys()];for(let k=11;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a.map(p=>`<i style="background-image:${bg(i)};background-position:${(p%3)/2*100}% ${Math.floor(p/3)/3*100}%"></i>`).join('')};
const th=(i,d,o)=>d?`<div class="th" style="background-image:${bg(i)}"></div>`:o?`<div class="th mos">${mos(i)}</div>`:`<div class="th lk">?</div>`;
const bg=i=>uri[i].replace(/"/g,'&quot;');
function setTop(t,logo,showBack,cnt){const h=$('ttl');h.textContent=t;h.className=logo?'logo':'';$('back').hidden=!showBack;$('cnt').textContent=cnt;const homeScreen=view==='home';$('lucky').hidden=!homeScreen;$('gear').hidden=!homeScreen}
let lucky=false,wt=0,wcb=null;
function goBack(){lucky=false;view==='play'?catView(F[cur].k):home()}

function home(){
  lucky=false;view='home';$('play').hidden=true;$('gal').hidden=false;
  setTop('FILMBOX',true,false,Object.keys(saved).length+'/'+F.length);
  $('gal').innerHTML='<p class="tag">Solve the poster. Unlock the film.</p>'+CATS.map((c,k)=>{
    const l=inCat(k),n=l.filter(done).length;
    return `<div class="cc" style="--c:${c[1]}" onclick="catView(${k})"><div class="r">${c[0]}<span>${n}/${l.length}</span></div><div class="pb"><i style="width:${n/l.length*100}%"></i></div></div>`}).join('');
}
function catView(k){
  lucky=false;view='cat';cat=k;$('play').hidden=true;$('gal').hidden=false;
  const l=inCat(k);setTop(CATS[k][0],false,true,l.filter(done).length+'/'+l.length);
  $('gal').innerHTML=l.map(i=>{
    const d=done(i),o=open_(i);
    return `<div class="row ${d?'':o?'p':'l'}" ${o?`onclick="openF(${i})"`:''}>${th(i,d,o)}<div><b>${d?F[i].t:o?'Next up':'Locked'}</b>${d?`<small>${F[i].y} · ${F[i].rt} min · ${F[i].d}</small>`:''}${!d?`<small>${o?'Tap to play':'Solve the previous film to unlock'}</small>`:''}</div></div>`}).join('');
}
function openF(i){
  cur=i;view='play';$('gal').hidden=true;$('play').hidden=false;
  done(i)?showCard():startPuzzle();
}
function startPuzzle(){
  [,cols,rows]=DIFF[lv];const M=cols*rows;
  do{order=[...Array(M).keys()];for(let i=M-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}while(order.every((p,i)=>p===i));
  sel=-1;moves=0;solved=false;
  $('flip').hidden=true;$('flip').classList.remove('f');$('pz').hidden=false;
  $('bNext').hidden=true;$('bLC').hidden=true;$('bWatch').hidden=true;document.querySelector('.ctl').classList.remove('col');
  setTop('Puzzle',false,true,inCat(F[cur].k).filter(done).length+'/'+inCat(F[cur].k).length);
  info();renderBoard();
}
function info(){$('info').textContent='Moves: '+moves+' · tap two pieces to swap'}
function renderBoard(){
  const b=$('board');b.className=solved?'done':'';b.innerHTML='';
  b.style.cssText=`position:absolute;inset:0;grid-template-columns:repeat(${cols},1fr);gap:${solved?0:2}px`;
  order.forEach((p,pos)=>{
    const d=document.createElement('div');
    d.className='t'+(p===pos?' ok':'')+(pos===sel?' sel':'');
    d.style.backgroundImage=uri[cur];d.style.backgroundSize=`${cols*100}% ${rows*100}%`;
    d.style.backgroundPosition=`${(p%cols)/(cols-1)*100}% ${Math.floor(p/cols)/(rows-1)*100}%`;
    d.onclick=()=>tap(pos);b.appendChild(d);
  });
}
function tap(pos){
  if(solved||order[pos]===pos)return;
  if(sel<0)sel=pos;
  else if(sel===pos)sel=-1;
  else{[order[sel],order[pos]]=[order[pos],order[sel]];sel=-1;moves++;}
  info();renderBoard();
  if(order.every((p,i)=>p===i)){
    solved=true;renderBoard();
    if(!done(cur)||moves<saved[cur])saved[cur]=moves;save();
    $('info').textContent='Solved in '+moves+' moves!';
    setTimeout(showCard,1100);
  }
}
function showCard(){
  const f=F[cur],l=inCat(f.k),last=l.indexOf(cur)===l.length-1;
  $('pz').hidden=true;$('flip').hidden=false;$('flip').classList.remove('f');
  $('fr').style.backgroundImage=uri[cur];setTop(f.t,false,true,l.filter(done).length+'/'+l.length);$('info').textContent='';
  $('bk').innerHTML=`<h2>${f.t}</h2><div class="m">${f.y}${f.rt?` · ${f.rt} min`:``} · Directed by ${f.d}</div><div class="rt"><a class="rating-link" href="https://www.imdb.com/find/?q=${encodeURIComponent(f.t+' '+f.y)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"><b>IMDb</b>${f.vr?'':'~'}${f.im}/10</a><a class="rating-link" href="https://letterboxd.com/search/films/${encodeURIComponent(f.t)}/" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"><b>Letterboxd</b>~${f.lb}/5</a>${(f.tm??f.rt)!=null?`<a class="rating-link" href="https://www.rottentomatoes.com/search?search=${encodeURIComponent(f.t)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"><b>RottenT</b>~${f.tm??f.rt}%</a>`:''}</div><h3>Cast</h3><p>${f.c}</p><h3>Story</h3><p>${f.s}</p>${f.aw?`<h3>Awards</h3><p>${f.aw}</p>`:''}<label class="watched" onclick="event.stopPropagation()"><input type="checkbox" ${watched[cur]?'checked':''} onchange="toggleWatched(${cur},this.checked)"><span>I’ve watched this film</span></label>`;
  const lk=lucky;$('bNext').hidden=lk;$('bLC').hidden=!lk;$('bWatch').hidden=!lk;document.querySelector('.ctl').classList.toggle('col',lk);
  $('bNext').textContent=last?'Back to '+CATS[f.k][0]:'Next film →';
  setTimeout(()=>$('flip').classList.add('f'),500);
}
function wmsg(h,t,ms,cb){$('wh').textContent=h;$('wp').textContent=t;wcb=cb||null;$('wov').classList.add('on');clearTimeout(wt);wt=setTimeout(wclose,ms)}
function wclose(){clearTimeout(wt);$('wov').classList.remove('on');const c=wcb;wcb=null;c&&c()}
function luckyGo(){
  closeSet();
  const c=CATS.map((_,k)=>inCat(k).find(i=>!done(i))).filter(i=>i!==undefined);
  if(!c.length){wmsg('You’ve solved them all!','Nothing left to unlock.',2200);return}
  lucky=true;openF(c[Math.floor(Math.random()*c.length)]);
}
function luckyCont(){lucky=false;next()}
function luckyWatch(){lucky=false;wmsg('Enjoy the movie!','Come back when you’re done.',2600,home)}
function next(){const l=inCat(F[cur].k),p=l.indexOf(cur);p<l.length-1?openF(l[p+1]):catView(F[cur].k)}
let SET={lv:0,theme:'light'};try{Object.assign(SET,JSON.parse(localStorage.getItem('fb_set')||'{}'))}catch(e){}
lv=SET.lv;document.documentElement.setAttribute('data-theme',SET.theme||'light');
const saveSet=()=>{try{localStorage.setItem('fb_set',JSON.stringify(SET))}catch(e){}};
function drawSet(){
  $('dseg').innerHTML=DIFF.map((d,k)=>`<button class="${k===lv?'on':''}" onclick="setLv(${k})">${d[0]}</button>`).join('');
  $('themeLight').classList.toggle('on',SET.theme==='light');$('themeDark').classList.toggle('on',SET.theme==='dark');
}
function setTheme(theme){SET.theme=theme;document.documentElement.setAttribute('data-theme',theme);saveSet();drawSet()}
function toggleWatched(i,checked){if(checked)watched[i]=true;else delete watched[i];saveWatched()}
function openSet(){drawSet();$('sov').classList.add('on')}
function closeSet(){$('sov').classList.remove('on')}
function setLv(k){lv=k;SET.lv=k;saveSet();drawSet();if(view==='play'&&$('flip').hidden)startPuzzle()}
home();
</script>
